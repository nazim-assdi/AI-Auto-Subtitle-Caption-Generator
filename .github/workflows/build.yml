name: Build and test

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend syntax and subtitle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: pip install -r backend/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q backend
      - name: Run subtitle helper tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform project
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.najim.ai --project-name ai_auto_subtitle_generator .
      - name: Enable local backend HTTP access
        working-directory: flutter_app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', s, count=1)
          if 'android:usesCleartextTraffic=' not in s:
              s = re.sub(r'<application\b', '<application android:usesCleartextTraffic="true"', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Run dashboard widget tests
        working-directory: flutter_app
        run: flutter test --no-pub
      - name: Analyze Dart code
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ai-auto-subtitle-generator-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-portable:
    name: Build Windows portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows platform project
        working-directory: flutter_app
        run: flutter create --platforms=android,windows --org com.najim.ai --project-name ai_auto_subtitle_generator .
      - name: Set app display names
        shell: pwsh
        run: |
          & ./tools/patch_android_manifest.ps1
      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: Build Windows release
        working-directory: flutter_app
        run: flutter build windows --release
      - name: Install Python backend build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
      - name: Download and verify FFmpeg shared runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-full-shared.7z'
          $checksumFile = Join-Path $env:RUNNER_TEMP 'ffmpeg-release-full-shared.7z.sha256'
          $archiveUrl = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full-shared.7z'
          Invoke-WebRequest -Uri $archiveUrl -OutFile $archive
          $checksumUrl = $archiveUrl + '.sha256'
          Invoke-WebRequest -Uri $checksumUrl -OutFile $checksumFile
          $checksumText = Get-Content $checksumFile -Raw
          $expected = [regex]::Match($checksumText, '[A-Fa-f0-9]{64}').Value.ToUpperInvariant()
          if (-not $expected) { throw 'The official FFmpeg SHA-256 file did not contain a valid checksum.' }
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "FFmpeg SHA-256 mismatch. Expected $expected but received $actual"
          }
          $sevenZip = Get-Command '7z.exe' -ErrorAction SilentlyContinue
          if ($sevenZip) {
            $sevenZipPath = $sevenZip.Source
          } else {
            $candidates = @(
              (Join-Path $env:ProgramFiles '7-Zip\7z.exe'),
              'C:\Program Files\7-Zip\7z.exe',
              'C:\Program Files (x86)\7-Zip\7z.exe'
            )
            $sevenZipPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $sevenZipPath) { throw '7-Zip was not found on the Windows runner.' }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'ffmpeg-extracted'
          $staging = Join-Path $env:RUNNER_TEMP 'ffmpeg-runtime'
          New-Item -ItemType Directory -Force -Path $extractRoot, $staging | Out-Null
          & $sevenZipPath x $archive "-o$extractRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the verified FFmpeg archive.' }
          $ffmpeg = Get-ChildItem $extractRoot -Filter 'ffmpeg.exe' -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'ffmpeg.exe was not found in the verified archive.' }
          $ffprobe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
          if (-not (Test-Path $ffprobe)) { throw 'ffprobe.exe was not found beside ffmpeg.exe.' }
          Copy-Item $ffmpeg.FullName (Join-Path $staging 'ffmpeg.exe') -Force
          Copy-Item $ffprobe (Join-Path $staging 'ffprobe.exe') -Force
          Get-ChildItem $ffmpeg.DirectoryName -Filter '*.dll' | Copy-Item -Destination $staging -Force
          & (Join-Path $staging 'ffmpeg.exe') -hide_banner -filters 2>&1 | Select-String '\bass\s'
          if ($LASTEXITCODE -ne 0) { throw 'The verified FFmpeg executable failed its filter check.' }
      - name: Package self-contained backend
        shell: pwsh
        run: |
          $runtime = 'flutter_app/dist/Windows_Portable/backend_runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --name ai_subtitle_backend --distpath $runtime --workpath "$env:RUNNER_TEMP/pyinstaller-work" --specpath "$env:RUNNER_TEMP/pyinstaller-spec" --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all tokenizers --collect-all huggingface_hub --collect-all yaml --collect-all argostranslate --collect-all sentencepiece --collect-all spacy --collect-all stanza --collect-all minisbd --collect-all sacremoses --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on "$PWD/backend/desktop_server.py"
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller backend packaging failed' }
          $ffmpegStaging = Join-Path $env:RUNNER_TEMP 'ffmpeg-runtime'
          if (-not (Test-Path (Join-Path $ffmpegStaging 'ffmpeg.exe'))) { throw 'Verified FFmpeg runtime staging files are missing.' }
          $ffmpegTarget = Join-Path $runtime 'ffmpeg'
          New-Item -ItemType Directory -Force -Path $ffmpegTarget | Out-Null
          Copy-Item (Join-Path $ffmpegStaging '*') -Destination $ffmpegTarget -Recurse -Force
          & (Join-Path $ffmpegTarget 'ffmpeg.exe') -hide_banner -filters 2>&1 | Select-String '\bass\s'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled FFmpeg does not expose the ASS filter.' }
          $built = Join-Path $runtime 'ai_subtitle_backend'
          if (-not (Test-Path (Join-Path $built 'ai_subtitle_backend.exe'))) { throw 'Backend executable missing' }
          Copy-Item (Join-Path $built '*') -Destination $runtime -Recurse -Force
          Remove-Item $built -Recurse -Force
          Copy-Item -Path 'flutter_app/build/windows/x64/runner/Release/*' -Destination 'flutter_app/dist/Windows_Portable' -Recurse -Force
          @'
          AI Auto Subtitle Generator - Windows self-contained build
          Start ai_auto_subtitle_generator.exe. The app launches its bundled local backend automatically.
          First launch requires internet access to download the selected Whisper model. Keep backend_runtime beside the app executable.
          '@ | Set-Content 'flutter_app/dist/Windows_Portable/README_BACKEND.txt' -Encoding UTF8
          Compress-Archive -Path 'flutter_app/dist/Windows_Portable/*' -DestinationPath 'flutter_app/dist/AI_Auto_Subtitle_Generator_Windows_Portable.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ai-auto-subtitle-generator-windows-portable
          path: flutter_app/dist/AI_Auto_Subtitle_Generator_Windows_Portable.zip
          if-no-files-found: error
