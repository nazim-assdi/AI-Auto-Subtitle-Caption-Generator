name: Build and test

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend syntax and subtitle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: pip install -r backend/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q backend
      - name: Run subtitle helper tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform project
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.najim.ai --project-name ai_auto_subtitle_generator .
      - name: Enable local backend HTTP access
        working-directory: flutter_app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    <uses-permission android:name="android.permission.INTERNET" />', s, count=1)
          if 'android:usesCleartextTraffic=' not in s:
              s = re.sub(r'<application\b', '<application android:usesCleartextTraffic="true"', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Run dashboard widget tests
        working-directory: flutter_app
        run: flutter test --no-pub
      - name: Analyze Dart code
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ai-auto-subtitle-generator-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-portable:
    name: Build Windows portable app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Windows platform project
        working-directory: flutter_app
        run: flutter create --platforms=android,windows --org com.najim.ai --project-name ai_auto_subtitle_generator .
      - name: Set app display names
        shell: pwsh
        run: |
          & ./tools/patch_android_manifest.ps1
      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Dart code
        working-directory: flutter_app
        run: flutter analyze --no-pub
      - name: Build Windows release
        working-directory: flutter_app
        run: flutter build windows --release
      - name: Package portable folder
        shell: pwsh
        run: |
          $release = 'flutter_app/build/windows/x64/runner/Release'
          $target = 'flutter_app/dist/Windows_Portable'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path "$release/*" -Destination $target -Recurse -Force
          Compress-Archive -Path "$target/*" -DestinationPath 'flutter_app/dist/AI_Auto_Subtitle_Generator_Windows_Portable.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ai-auto-subtitle-generator-windows-portable
          path: flutter_app/dist/AI_Auto_Subtitle_Generator_Windows_Portable.zip
          if-no-files-found: error
